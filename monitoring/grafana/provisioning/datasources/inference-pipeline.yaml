apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: 127.0.0.1
      port: 8123
      protocol: http
      username: default
      defaultDatabase: pipeline
      defaultTable: pipeline_events
    secureJsonData:
      password: ""
    editable: true
