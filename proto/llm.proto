syntax = "proto3";

// Orchestrator <-> LLM contract. One unary call per COMPLETED turn: the
// orchestrator joins that turn's STT segments (see asr.proto's turn_complete/
// segment_index) into the full user utterance and sends it once; the LLM
// service returns the complete generated reply. The orchestrator supplies
// structured, bounded multi-turn history; the worker that owns the exact model
// tokenizer performs the final token-budget guard before generation.
//
// This seam is model-agnostic on purpose, same spirit as asr.proto — the
// service behind it can be any LLM backend. (Phase N uses a local MedGemma-4B
// GGUF via vLLM; PRD's eventual topology is MedGemma-27B FP8 behind an
// OpenAI-compatible HTTP surface — swap the backend, not this contract.)
package llm.v1;

service Llm {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc GenerateStream(GenerateRequest) returns (stream GenerateChunk);
}

// Delta-only chunks. `is_final` carries the completed profile and makes text
// ownership explicit: callers concatenate only `text_delta`.
message GenerateChunk {
  string session_id = 1;
  string text_delta = 2;
  int64 ts_ms = 3;
  bool is_final = 4;
  InferenceProfile profile = 5;
}

message GenerateRequest {
  string session_id = 1;
  // Kept for wire compatibility and legacy callers. New callers also populate
  // messages; workers fall back to one USER message containing text when the
  // repeated field is empty.
  string text        = 2;
  int64  ts_ms       = 3;
  repeated ChatMessage messages = 4;
}

message ChatMessage {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    // Reserved for a future trusted context builder. Current workers own their
    // system prompt and accept only USER/ASSISTANT request messages.
    SYSTEM            = 1;
    USER              = 2;
    ASSISTANT         = 3;
  }
  Role   role    = 1;
  string content = 2;
}

message GenerateResponse {
  string session_id = 1;
  string text        = 2;  // the model's generated reply
  int64  ts_ms       = 3;
  int64  proc_ms     = 4;  // LLM-side wall time to produce this reply (dispatch->result)
  InferenceProfile profile = 5;
}

// Structured service-side profiling. `proc_ms` remains the compatible total;
// this object exposes the pieces needed for session-performance analysis.
message InferenceProfile {
  string model = 1;
  string engine = 2;
  string device = 3;
  string compute_type = 4;
  double queue_ms = 5;
  double prompt_build_ms = 6;
  double prefill_ms = 7;
  double ttft_ms = 8;
  double decode_ms = 9;
  double compute_ms = 10;
  int32 input_tokens = 11;
  int32 output_tokens = 12;
  double decode_tokens_per_second = 13;
  map<string, string> attributes = 14;
}
