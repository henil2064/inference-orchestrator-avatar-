      "tier": "e2e",
      "default": false,
      "cwd": "pipeline_test",
      "python": ".venv/bin/python",
      "env": {"PYTHONPATH": "."},
      "commands": [["python", "stream_wav.py"]]
    },
    "pipeline-load-burst": {
      "description": "Closed-loop concurrent WebRTC load generator; requires the running stack and WAV recordings.",
      "tier": "e2e",
      "default": false,
      "cwd": "pipeline_test",
      "python": ".venv/bin/python",
      "env": {"PYTHONPATH": "."},
      "commands": [["python", "load_burst.py", "--concurrency", "1"]]
    },
    "pipeline-open-loop": {
      "description": "Open-loop scheduled WebRTC load generator; requires the running stack and WAV recordings.",
      "tier": "e2e",
      "default": false,
      "cwd": "pipeline_test",
      "python": ".venv/bin/python",
      "env": {"PYTHONPATH": "."},
