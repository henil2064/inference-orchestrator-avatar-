[pytest]
asyncio_mode = auto
markers =
    unit: pure logic tests with no network, model, GPU, Docker, or service process
    service: one service boundary tested with fakes or mocks
    integration: multi-service or external infrastructure checks
    e2e: real pipeline checks
    model: requires model/runtime backend packages or model assets
    gpu: requires CUDA/GPU availability
    slow: slow correctness checks
    bench: benchmark or load tests
